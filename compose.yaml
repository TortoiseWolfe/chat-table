services:
  app:
    image: node:22-alpine
    working_dir: /work
    volumes:
      - .:/work
    user: "1000:1000"
    environment:
      HOME: /tmp
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:8787:8787"

  chat-table:
    image: ${CHAT_TABLE_IMAGE:-ghcr.io/tortoisewolfe/chat-table:latest}
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8787:8787"
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    profiles:
      - run

volumes:
  data:
