<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chat-table overlay</title>
    <link rel="stylesheet" href="/overlay/overlay.css" />
  </head>
  <body>
    <main id="stage">
      <section id="map"><div id="scene"></div></section>
      <section id="tokens" aria-label="Characters"></section>

    </main>
    <script src="/overlay/overlay.js"></script>
  </body>
</html>
